|想拍|想写|聊聊|如何|为什么/.test(x.title)?'选题':'观点'}:x);let view='欢迎',filter='全部',query='',selected=null,draft='',notice='',intakeType='',intakeTags=[],tagQuery='',intakeLikes='',intakeComments=[''],draftPage=false,libraryStatus='全部',libraryTag='',dateFrom='',dateTo='',calendarTab='收集';function persist(){try{localStorage.setItem('paper-workbench-v3',JSON.stringify(data));return true}catch{alert('浏览器未能保存，请保留原始素材后重试。');return false}}function classify(t){let type='其他素材';if(t.length>120||/逐字稿|完整文案|完整稿/.test(t))type='稿件';else if(/客户|曾经|后来|一位|案例|故事/.test(t)&&!/你以为/.test(t))type='故事案例';else if(/你以为|开头|钩子|前三秒|千万别/.test(t))type='钩子开头';else if(/选题|想拍|想写|聊聊|讨论|如何|为什么/.test(t))type='选题';else if(/观点|认为|本质|价值|应该/.test(t))type='观点';const tags=[['内容策略',/内容|视频|文案|选题/],['客户转化',/客户|咨询|成交|转化/],['定价',/价格|贵|定价/],['知识管理',/素材|积累|知识|整理/],['个人成长',/成长|学习|习惯/]].filter(x=>x[1].test(t)).map(x=>x[0]);return{type,tags:tags.length?tags:['待整理']}}function go(v){draftPage=false;if($('#raw'))draft=$('#raw').value;view=v;query='';filter='全部';libraryStatus='全部';libraryTag='';dateFrom='';dateTo='';selected=null;render();window.scrollTo(0,0);if(typeof $('#main').animate==='function'&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches)$('#main').animate([{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,easing:'ease-out'})}function render(){document.body.dataset.page=view; $('#nav').innerHTML=['首页','入库','素材库收集箱','待洗稿','创作日历'].map(v=>`<button class="${view===v?'active':''}" data-view="${v}">${v}</button>`).join('');if(view==='欢迎'){renderWelcome();return}if(view==='首页'){renderHome();return}if(view==='创作日历'){renderCalendar();return}if(view==='素材库收集箱'&&selected!==null){renderMaterialPage();return}if(view==='待洗稿'&&draftPage){renderDraftPage();return}if(view==='入库'){$('#main').innerHTML=`<div class="intake"><div class="eyebrow">先收下来，再慢慢创作</div><h1>把好素材，放进来。</h1><p>粘贴素材，选择分类和标签，存入对应收集箱。</p><textarea id="raw" placeholder="粘贴一篇文案、一段故事、一个开头、一个选题或观点……">${esc(draft)}</textar function renderTags(){if(!$('#tagChoices'))return;$('#selectedTags').innerHTML=`<div class="tabs">${intakeTags.map(t=>`<button class="on" data-intake-tag="${esc(t)}">${esc(t)} ×</button>`).join('')}</div>`;let q=tagQuery.trim();let groups=Object.entries(tagGroups).map(([name,tags])=>[name,tags.filter(t=>t.includes(q))]).filter(x=>x[1].length);$('#tagChoices').innerHTML=groups.map(([name,tags])=>`<details ${q?'open':''}><summary>${name} <span class="meta">${tags.length} 项</span></summary><div class="tabs">${tags.map(t=>`<button type="button" aria-pressed="${intakeTags.includes(t)}" class="${intakeTags.includes(t)?'on':''}" data-intake-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div></details>`).join('')||'<p>暂无匹配关键词，可换一个词搜索。</p>'}function nextId(){return Math.max(Date.now(),...data.map(x=>Number(x.id)||0))+1}
function sourceNotes(x){return `<details class="source-notes"><summary>查看原作点赞量与热评</summary><p>原作品点赞量：${x.likes==null?'未填写':esc(x.likes)}</p>${(x.comments||[]).map((c,i)=>c?`<div class="basket"><strong>热评 ${i+1}</strong><p>${esc(c)}</p></div>`:'').join('')||'<p>尚未记录热评</p>'}</details>`}function renderDraftPage(){let x=data.find(x=>x.id===selected);if(!x){draftPage=false;render();return}$('#main').innerHTML=`<div class="draft-page"><div class="item-toolbar"><button class="subtle" id="backDrafts">← 返回待洗稿列表</button><button class="subtle danger" data-delete="${x.id}">删除稿件</button></div><div class="editor" style="margin-top:20px"><label for="editTitle">标题</label><input id="editTitle" value="${esc(x.title)}"><label for="editBody">文案</label><textarea id="editBody" style="min-height:55vh">${esc(x.body)}</textarea><div class="meta">修改后自动保存</div>${specialTagButton(x)}<details><summary>安排日期或标记完成</summary><button class="subtle" data-complete="${x.id}">${x.completed?'恢复待处理':'标记已完成'}</button><div class="schedule-inline"><label for="plannedDate">计划日期</label><input id="plannedDate" type="date" value="${esc(x.plannedDate||'')}"><label for="planKind">计划用途</label><select id="planKind"><option ${x.planKind==='创作'?'selected':''}>创作</option><option ${x.planKind==='发布'?'selected':''}>发布</option></select><button class="subtle" data-view="创作日历">在日历中查看 ↗</button></div></details></div>${sourceNotes(x)}<details><summary>查看已选素材 · ${(x.basket||[]).length} 条</summary>${(x.basket||[]).map(id=>data.find(y=>y.id===id)).filter(Boolean).map(y=>`<div class="basket"><strong>${esc(y.title)}</strong><p>${esc(y.body)}</p></div>`).join('')||'<p>可在素材库里把素材加入这篇稿件。</p>'}</details></div>`}
function detail(){if(view==='待洗稿')return;let el=$('#detail');if(!el)return;let x=data.find(x=>x.id===selected);if(!x){el.innerHTML='<div class="empty">点开一条内容，查看详情与关联素材</div>';return}let rec=data.filter(y=>y.type!=='稿件'&&y.id!==x.id).map(y=>({y,score:y.tags.filter(t=>x.tags.includes(t)).length})).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,4);el.innerHTML=`<div class="editor"><div class="item-toolbar"><h2>素材详情</h2><button class="subtle danger" data-delete="${x.id}">删除素材</button></div><label>标题</label><input id="editTitle" value="${esc(x.title)}"><label>正文</label><textarea id="editBody">${esc(x.body)}</textarea><label>标签（逗号分隔）</label><input id="editTags" value="${esc(x.tags.join(', '))}">${specialTagButton(x)}<label>分类</label><select id="editType">${(x.type==='稿件'?['稿件']:kinds).map(t=>`<option value="${t}" ${t===x.type?'selected':''}>${t==='稿件'?'待洗稿':t}</option>`).join('')}</select><button class="primary" id="save">保存分类并更新列表</button><p class="meta">标题、正文和标签修改后自动保存</p>${x.type==='稿件'?`<div class="recommend"><h3>这篇稿件的素材篮</h3>${(x.basket||[]).map(id=>data.find(y=>y.id===id)).filter(Boolean).map(y=>`<div class="basket">${esc(y.body)} <button class="subtle" data-remove="${y.id}">移除</button></div>`).join('')||'<p>从下面挑选素材，加入这篇稿件。</p>'}<h3>相关素材 · 按共同标签推荐</h3>${rec.map(({y})=>`<div class="mini"><button class="subtle" data-use="${y.id}" ${(x.basket||[]).includes(y.id)?'disabled':''}>${(x.basket||[]).includes(y.id)?'已加入':'加入'}</button>${esc(y.title)}<div class="meta">${esc(y.type)}</div></div>`).join('')||'<p>暂无共同标签的素材。</p>'}</div>`:`<div class="recommend"><button class="primary" id="startDraft">以此素材新建待洗稿</button>${sourceNotes(x)}<h3>加入已有待洗稿件</h3>${data.filter(y=>y.type==='稿件').map(y=>`<div class="mini"><button class="subtle" data-attach="${y.id}">加入</button>${esc(y.title)}</div>`).join('')||'<p>先入库一篇完整稿件。</p>'}</div>`}</div>`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(handleSimple(b))return;if(handleCalendar(b))return;if(b.id==='backDrafts'){draftPage=false;selected=null;render();window.scrollTo(0,0);return}if(b.id==='addComment'){draft=$('#raw').value;intakeComments.push('');render();let field=$('#comment'+(intakeComments.length-1));document.querySelectorAll('.intake-extras details,.intake-extras').forEach(d=>d.open=true);field.closest('details').open=true;field.focus({preventScroll:true});field.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});return}if(b.dataset.view){if(b.dataset.view==='创作日历'&&draftPage)calendarTab='计划';go(b.dataset.view);return}if(b.dataset.filter){filter=b.dataset.filter;selected=null;render();return}if(b.dataset.open){selected=Number(b.dataset.open);if(view==='待洗稿'){draftPage=true;render();window.scrollTo(0,0);return}if(view==='素材库收集箱'&&filter==='全部'){const opened=data.find(x=>x.id===selected);if(opened)filter=opened.type}render();return}if(b.dataset.intakeType){draft=$('#raw').value;intakeType=b.dataset.intakeType;render();return}if(b.dataset.intakeTag){draft=$('#raw').value;let t=b.dataset.intakeTag;intakeTags=intakeTags.includes(t)?intakeTags.filter(v=>v!==t):[...intakeTags,t];let opened=[...document.querySelectorAll('#tagChoices details')].map(d=>d.open);renderTags();document.querySelectorAll('#tagChoices details').forEach((d,i)=>d.open=opened[i]);return}if(b.id==='ingest'){let raw=$('#raw').value.trim();if(!raw){$('#raw').focus();return}if(data.some(x=>x.body===raw)){notice='这条素材已经入库，无需重复添加。';draft=raw;render();return}if(intakeLikes!==''&&(!Number.isSafeInteger(Number(intakeLikes))||Number(intakeLikes)<0)){draft=raw;notice='点赞量请填写非负整数。';render();return}if(!intakeType){draft=raw;notice='请选择一个收集箱后再入库。';render();return}let r={type:intakeType,tags:[...intakeTags]},x={id:nextId(),type:r.type,tags:r.tags,title:raw.split(/[\n。！？]/)[0].slice(0,35),bo
